name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    name: 语法检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 安装 shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: shellcheck
        # 首次发布先用 error 级别保证绿灯；等告警清理干净后再收紧到 warning。
        # 已知需要长期豁免的规则：SC2086（有意为之的单词拆分）、
        # SC1090/SC1091（动态 source）、SC2016（awk/sed 单引号脚本里的 $ 变量）。
        run: |
          shellcheck -S error -x -e SC2086,SC1090,SC1091,SC2016 \
            le-oneclick.sh tests/run.sh tests/mock/bin/*

      - name: 运行测试
        run: sh tests/run.sh
